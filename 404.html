<!doctype html>
<html lang="gu" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>404 | Trividha Solar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,system-ui,sans-serif;background:radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 28%),radial-gradient(circle at top right, rgba(245,158,11,.16), transparent 26%),linear-gradient(180deg,#050b14 0%,#07111f 100%);color:#e5eefc;padding:24px;text-align:center}
    .box{max-width:560px;width:100%;background:rgba(15,23,42,.86);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:38px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
    .logo{width:96px;height:96px;margin:0 auto 18px}
    h1{margin:0 0 10px;font-size:clamp(2.2rem,4vw,3.4rem)}
    p{margin:0 0 26px;color:#a7b7d6;line-height:1.7;font-family:Outfit,system-ui,sans-serif}
    a{display:inline-flex;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#fb7185);color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/assets/logo.svg" alt="Trividha Solar logo" />
    <h1>404</h1>
    <p>આ પેજ મળ્યો નથી. કૃપા કરીને હોમપેજ પર પાછા જાઓ.</p>
    <a href="/">Go to Home</a>
  </main>
</body>
</html>
